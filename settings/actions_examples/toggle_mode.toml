# ==============================================================================
# EXEMPLE D'ACTION TOGGLE MODE (settings/actions_examples/toggle_mode.toml)
# ==============================================================================

[[actions]]
name = "Toggle Mode Spécial/Normal"
description = "Bascule entre le mode normal et le mode spécial."
modes = ["normal", "special"]
trigger = "!"
toggle = true

states = [
    { name = "Vers Spécial", commands = [{ type = "mode", params = ["special"] }] },
    { name = "Vers Normal", commands = [{ type = "mode", params = ["normal"] }] }
]
