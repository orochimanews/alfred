[general]
app_name = "Alfred"
default_mode = "normal"
special_mode_key = "!"
special_mode_name = "special"
toggle_special_mode = true
[mouse]
# use_system_speed: si true (défaut), utilise la vitesse configurée sous Windows.
# Si false, applique la sensibilité personnalisée 'default_speed' ci-dessous (1 à 20).
use_system_speed = true
default_speed = 10

[ui]
theme = "dark"
color_theme = "blue"
font_size = 13
always_on_top = false
start_minimized = false
