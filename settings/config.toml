[general]
app_name = "Alfred"
default_mode = "special"
start_in_special_mode = true
auto_exit_on_text_input = true
auto_return_on_enter = true
close = "ctrl+w"
quit = "²"
special_mode_key = "!"

[modes.normal]
name = "Normal"
description = "Mode standard Windows (les touches fonctionnent normalement)."

[modes.special]
name = "Spécial"
description = "Mode Alfred (les touches interceptées déclenchent des actions et raccourcis)."

[modes.grid]
name = "Grille"
description = "Mode grille (déplacement rapide du curseur souris par zone d'écran)."

[modes.subgrid]
name = "Sous-grille"
description = "Mode sous-grille (division 3x3 de la case courante pour un ciblage ultra précis)."

[mouse]
use_system_speed = true
default_speed = 9

[ui]
theme = "dark"
color_theme = "blue"
font_size = 13
always_on_top = false
start_minimized = false
show_screen_indicator = true
screen_indicator_offset_x = 12
screen_indicator_offset_y = 12
screen_indicator_size = 20
