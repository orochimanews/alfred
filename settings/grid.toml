# ==============================================================================
# CONFIGURATION DE LA GRILLE SOURIS (GRID NAVIGATION)
# ==============================================================================
# Découpe l'écran en une grille de cases rectangulaires.
# Lorsqu'une touche associée est pressée dans le mode spécifié, le curseur saute
# instantanément au centre de la case correspondante.

[grid]
enabled = true
columns = 3
rows = 3

# Mode dans lequel les raccourcis de la grille sont actifs
# Ex: "grid", "special", ou "all"
active_modes = ["grid"]

# Comportement après le saut vers une case
exit_mode_after_jump = false       # Si true, repasse en mode normal après le saut
auto_click = false                 # Si true, effectue un clic gauche au centre de la case

# Mappage des touches vers les coordonnées de case [colonne, ligne] (indexé à 0)
# Pour une grille 3x3 sur clavier AZERTY :
#  Ligne 0 (haut)   : [a] (0,0)   [z] (1,0)   [e] (2,0)
#  Ligne 1 (milieu) : [q] (0,1)   [s] (1,1)   [d] (2,1)
#  Ligne 2 (bas)    : [w] (0,2)   [x] (1,2)   [c] (2,2)
#
# Supporte également les touches du pavé numérique (num_7, num_8, etc.)

[cells]
a = [0, 0]
z = [1, 0]
e = [2, 0]
q = [0, 1]
s = [1, 1]
d = [2, 1]
w = [0, 2]
x = [1, 2]
c = [2, 2]

# Pavé numérique (optionnel alternatif)
num_7 = [0, 0]
num_8 = [1, 0]
num_9 = [2, 0]
num_4 = [0, 1]
num_5 = [1, 1]
num_6 = [2, 1]
num_1 = [0, 2]
num_2 = [1, 2]
num_3 = [2, 2]
