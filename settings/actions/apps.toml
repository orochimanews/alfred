[[actions]]
name = "Quitter Alfred"
description = "Ferme proprement l'application Alfred."
modes = ["all"]
trigger = "²"
commands = [
    { type = "quit" }
]

[[actions]]
name = "Lancer Google Chrome"
description = "Ouvre directement le vrai navigateur Google Chrome"
modes = ["special"]
trigger = "^"
commands = [
    { type = "app", params = ["C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe"] }
]

[[actions]]
name = "Lancer Brave Browser"
description = "Ouvre ou affiche le navigateur Brave"
modes = ["special"]
trigger = "p"
commands = [
    { type = "app", params = ["C:\\Program Files\\BraveSoftware\\Brave-Browser\\Application\\brave.exe"] }
]

[[actions]]
name = "Lancer Antigravity Agent"
