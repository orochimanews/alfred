

[[actions]]
name = "Zoom Avant"
description = "Agrandit le zoom de l'affichage"
modes = ["special"]
trigger = "="
commands = [
    { type = "zoom", direction = "in" }
]

[[actions]]
name = "Zoom Arrière"
description = "Réduit le zoom de l'affichage"
modes = ["special"]
trigger = ')'
commands = [
    { type = "zoom", direction = "out" }
]


[[actions]]
name = "Molette Haut (Scroll Up)"
description = "Défilement vertical vers le haut"
modes = ["special"]
trigger = "$"
commands = [
    { type = "scroll", delta = 2 }
]

[[actions]]
name = "Molette Bas (Scroll Down)"
description = "Défilement vertical vers le bas"
modes = ["special"]
trigger = "*"
commands = [
    { type = "scroll", delta = -2 }
]

[[actions]]
name = "Début"
description = "Début de page / document (Ctrl + Home)"
modes = ["special"]
trigger = ""
commands = [
    { type = "hotkey", params = ["ctrl", "home"] }
]

[[actions]]
name = "Fin"
description = "Fin de page / document (Ctrl + End)"
modes = ["special"]
trigger = ""
commands = [
    { type = "hotkey", params = ["ctrl", "end"] }
]

