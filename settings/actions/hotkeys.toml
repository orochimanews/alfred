# ==============================================================================
# ACTIONS DU MODE SPÉCIAL (settings/actions/hotkeys.toml)
# ==============================================================================
# Chaque action définit un tableau 'commands = [ ... ]' contenant ses commandes.
# Les paramètres peuvent être passés sous forme d'array 'params = [...]' pour
# une structure claire et compacte.

[[actions]]
name = "Nouvel Onglet Navigateur"
description = "Ouvre un nouvel onglet avec Ctrl+T"
modes = ["special"]
trigger = "t"
commands = [
    { type = "hotkey", params = ["ctrl", "t"] }
]

