# ==============================================================================
# ACTIONS MACROS (settings/actions/macros.toml)
# ==============================================================================
# Ce fichier regroupe les macros multi-commandes d'Alfred.
# Chaque action définit un tableau 'commands = [ ... ]' contenant ses commandes.
# Vous pouvez ajouter d'autres macros à la suite sous forme de blocs [[actions]].

[[actions]]
name = "Terminal Bun Dev"
description = "Ouvre le terminal dans le dossier courant de l'Explorateur et lance 'bun dev'"
modes = ["special"]
trigger = "/"
commands = [
    { type = "hotkey", params = ["alt", "d"] },
    { type = "sleep", params = [0.15] },
    { type = "text", params = ["cmd"] },
    { type = "hotkey", params = ["enter"] },
    { type = "sleep", params = [0.8] },
    { type = "text", params = ["bun dev"] },
    { type = "hotkey", params = ["enter"] }
]


[[actions]]
name = "Focus Page"
description = "Déplace la souris en haut-centre-droit et clique pour donner le focus à la zone de contenu principale (générique : YouTube, navigateurs, apps)."
modes = ["special"]
trigger = "n"
commands = [
    { type = "jump", params = [400, 130] },
    { type = "click", params = ["left"] }
]

[[actions]]
name = "Clic et Mode Normal"
description = "Effectue un clic gauche et bascule vers le mode normal"
modes = ["special"]
trigger = "e"
commands = [
    { type = "click", params = ["left"] },
    { type = "mode", params = ["normal"] }
]

[[actions]]
name = "Entrée et Mode Normal"
description = "Simule la touche Entrée et bascule vers le mode special"
modes = ["normal"]
trigger = "$"
commands = [
    { type = "hotkey", params = ["enter"] },
    { type = "mode", params = ["special"] }
]
