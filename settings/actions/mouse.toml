[[actions]]
name = "Clic Gauche"
description = "Simule un clic du bouton gauche"
modes = ["special"]
trigger = "d"
commands = [
    { type = "click", params = ["left"] }
]

[[actions]]
name = "Clic Milieu"
description = "Simule un clic molette (bouton du milieu)"
modes = ["special"]
trigger = "f"
commands = [
    { type = "middle_click" }
]

[[actions]]
name = "Clic Droit"
description = "decimal"
modes = ["special"]
trigger = "g"
commands = [
       { type = "click", button = "right" }
]

[[actions]]
name = "Double-Clic"
description = "Simule un double-clic du bouton gauche"
modes = ["special"]
trigger = "decimal"
commands = [
    { type = "click", button = "left", clicks = 2 }
]

[[actions]]
name = "Drag & Drop"
description = "Bascule le maintien et le relâchement du clic gauche (glisser-déposer)"
modes = ["special"]
trigger = ";"
toggle = true
states = [
    { name = "Maintien Clic (Drag)", commands = [{ type = "mouse_down", button = "left" }] },
    { name = "Relâchement Clic (Drop)", commands = [{ type = "mouse_up", button = "left" }] }
]

[[actions]]
name = "Vitesse Souris / Trackpad"
description = "Bascule la vitesse du pointeur entre rapide (18) et normale (10)"
modes = ["special"]
trigger = ""
commands = [
    { type = "mouse_speed", speed = 100, toggle = true }
]

[[actions]]
name = "Mode Nudge Souris / Trackpad"
description = "Bascule le mode Nudge : les mouvements de souris/trackpad avancent par bonds directionnels rapides"
modes = ["special"]
trigger = ""
commands = [
    { type = "mouse_nudge", step = 400, toggle = true }
]



